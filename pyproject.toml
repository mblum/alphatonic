[project]
name = "alphatonic"
version = "0.1.0"
description = "Evaluate predictive signals with cross-sectional and time-series information coefficients, dependence-aware uncertainty, and offline tearsheets: a successor to alphalens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Manuel Blum" }]
keywords = [
    "quant",
    "alpha",
    "factor",
    "signal",
    "information coefficient",
    "alphalens",
    "backtesting",
    "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The offline HTML tearsheet. Evaluation itself needs only the core dependencies.
report = [
    "plotly>=6,<7",
    "jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/mblum/alphatonic"
Source = "https://github.com/mblum/alphatonic"
Issues = "https://github.com/mblum/alphatonic/issues"
Changelog = "https://github.com/mblum/alphatonic/blob/HEAD/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "plotly>=6,<7",
    "jinja2>=3.1,<4",
]
# Not a default group: `uv run --group docs zensical serve`.
docs = [
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.63",
    "plotly>=6,<7",
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphatonic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ is documented on the class
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["alphatonic"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
