[project]
name = "alphatonic"
version = "0.3.0"
description = "alphatonic measures how well trading signals predict future returns"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manuel Blum" }]
keywords = [
    "quant",
    "alpha",
    "factor",
    "signal",
    "information coefficient",
    "backtesting",
    "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2.2",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Kept empty so that `pip install "alphatonic[report]"` keeps working; jinja2 is now a core
# dependency. Remove it in a later release.
report = []

[project.scripts]
alphatonic = "alphatonic.cli:main"

[project.urls]
Homepage = "https://github.com/mblum/alphatonic"
Documentation = "https://mblum.github.io/alphatonic/"
Source = "https://github.com/mblum/alphatonic"
Issues = "https://github.com/mblum/alphatonic/issues"
Changelog = "https://github.com/mblum/alphatonic/blob/HEAD/CHANGELOG.md"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "quality"},
]
# Not a default group: `uv run --group docs zensical serve`.
docs = [
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.63",
]
quality = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
    "twine>=7.0.0",
]
test = [
    "build>=1.6.1",
    "coverage>=7.17.0",
    "hatchling>=1.33.0",
    "hypothesis>=6.170.14",
    "pip>=26.2.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphatonic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CONTRIBUTING.md", "TESTING.md", "benchmarks", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ is documented on the class
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --strict-config"
filterwarnings = ["error"]
timeout = 60
junit_family = "xunit1"
markers = [
    "property: generated invariants and metamorphic relations",
    "statistical: simulation-based method validation",
    "slow: expanded experiments and the packaging test, outside the default run",
    "benchmark: controlled performance measurements",
]

[tool.coverage.run]
source = ["alphatonic"]
branch = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
