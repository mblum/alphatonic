name: Release

# A release is a tag X.Y.Z (no "v") on master, equal to the version in pyproject.toml.
# Pushing the tag publishes the documentation, built from the tag, to GitHub Pages.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One deployment at a time; never cancel one that has started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all of master, to check that the tag is on it
      - uses: astral-sh/setup-uv@v6
      - name: The tag is on master, matches the version and has a changelog section
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tag $GITHUB_REF_NAME is not on master."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
      - run: uv sync --group docs --locked
      - run: uv run --group docs zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
